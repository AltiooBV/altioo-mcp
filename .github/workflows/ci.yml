name: CI

# The claim on the Hub listing is "tested on PHP 8.2, 8.3 and 8.4". This is
# what makes that claim checkable by someone who is deciding whether to trust
# the extension with their CMDB.
#
# This is where the PHP matrix question is answered. itop-matrix.yml repeats the
# unit suite once, on one version, as its own gate - a workflow cannot depend on
# a job in another workflow, and its install jobs are too expensive to start on a
# tree that fails here. Do not deduplicate the two.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Tuesday morning. The audit job below is the one check whose verdict
    # changes with no commit - an advisory published against a locked version
    # is news whether or not anybody pushed - so on a quiet repository it has
    # to be started by something other than a push.
    - cron: '29 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Stage 1 (AGENTS.md §12.3): the cheapest and most decisive gate, and the
  # one §4.8 states as a MUST. It fails on the tree as written rather than on
  # the tree as run, so it goes before the suites and before anything that
  # needs an iTop.
  lint:
    name: Coding standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          coverage: none
          # phpcs is deliberately not a composer dependency: composer.lock is
          # shipped inside the archive and vendor/ is built from it with
          # --no-dev, so a linter added there is a package an operator can see
          # in the bill of materials but never runs. It is build tooling, and
          # it is installed like build tooling.
          tools: composer:v2, phpcs

      # The standard is tools/phpcs/iTop - Combodo's, carrying no path of this
      # repository - and phpcs.xml.dist is what points it at this tree. The
      # full report goes to the log rather than through an annotator, so that
      # what failed is readable from the job page alone.
      - name: Combodo's coding standard
        run: phpcs

  # Two things about the workflow files themselves, neither of which any suite
  # can check: they fail on GitHub or not at all.
  workflows:
    name: Workflow files are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A context used where it does not exist is a *parse* error: GitHub
      # rejects the whole file and the workflow does not run at all, which
      # looks identical to a workflow nobody triggered. upgrade.yml and
      # itop-matrix.yml both shipped with `${{ runner.temp }}` in a job-level
      # `env:` and neither had ever run; the first push to a public repository
      # is what said so. `runner` and `steps` exist only inside steps.
      - name: No job-level key may use a step-only context
        run: |
          python3 - <<'PY'
          import sys, glob, yaml
          JOB_LEVEL = ['env', 'if', 'container', 'services', 'strategy',
                       'concurrency', 'timeout-minutes', 'runs-on']
          STEP_ONLY = ['runner.', 'steps.']
          bad = []
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              for job, spec in (yaml.safe_load(open(f)).get('jobs') or {}).items():
                  for key in JOB_LEVEL:
                      if key not in spec:
                          continue
                      dumped = yaml.dump(spec[key])
                      for ctx in STEP_ONLY:
                          if ctx in dumped:
                              bad.append(f"{f}: job '{job}', {key}: uses {ctx.rstrip('.')}")
          for b in bad:
              print(b)
          if bad:
              print()
              print("the context above does not exist where it is used; GitHub refuses the")
              print("whole file, so the workflow silently never runs. Move it into a step.")
              sys.exit(1)
          print("no job-level key uses a step-only context")
          PY

      - name: No workflow may reference an action by tag
        run: |
          set -euo pipefail
          if grep -rnP '^\s*(-\s*)?uses:\s*[^./].*@(?![0-9a-f]{40}(\s|$))' .github/workflows/; then
            echo
            echo "the references above name a mutable tag; pin them to the full commit SHA"
            echo "and leave the version in a trailing comment:  uses: owner/action@<sha> # v1.2.3"
            exit 1
          fi
          echo "every action is pinned to a 40-character commit SHA"

  tests:
    name: Unit suite on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The range declared in composer.json: floor 8.2 because the locked
        # dependencies require it - symfony/uid and webmozart/assert - rather
        # than because iTop does, iTop 3.2's own floor being 8.1. Ceiling 8.4
        # because no iTop branch validates 8.5.
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Checked against the PHP this job actually runs, which is the point of
      # running it three times: it proves the one committed lock is installable
      # on every version the extension claims, extensions included.
      #
      # It does NOT read config.platform.php - that override applies when
      # `composer update` resolves, not here. Verified 2026-09-19: this step
      # reports the real runtime (8.2.33 on the 8.2 job, 8.4.25 on the 8.4 one),
      # not the pinned 8.2.0. The two do different jobs and the pin is the
      # reason this step can pass on 8.2 at all - drop it and an update run on a
      # developer's 8.4 resolves symfony/uid to a release needing >=8.4.1, which
      # this step then fails on 8.2 and 8.3.
      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Unit suite
        run: composer test:unit

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Advisories against the locked versions. mcp/sdk is pre-1.0 and vendored
      # into the archive, so this is the check that a shipped dependency has not
      # gone bad since the last release.
      - name: composer audit
        run: composer audit --locked

  # The pack's README says `composer test`, and that is the first thing a pack
  # author does. It could not work: no phpunit configuration, no autoload-dev
  # for the namespace its own test declares, and the base extension - whose
  # ElementContract the test imports - reachable from nowhere. Running it here
  # is what stops the instructions and the files from drifting apart again.
  example-pack:
    name: The example pack runs as documented
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      # The pack finds the base beside it under extensions/, or through
      # ALTIOO_MCP_ROOT. In a checkout it is the directory two levels up, which
      # its bootstrap tries second - but the base's vendor/ has to exist for
      # either to work.
      - name: Build the base extension the pack resolves against
        run: composer install --no-dev --no-interaction --no-progress

      - name: The three commands the pack's README gives
        working-directory: doc/example-pack
        run: |
          set -euo pipefail
          composer install --no-interaction --no-progress
          composer test

  package:
    name: Release archive builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      # What store users unzip into extensions/: production dependencies only,
      # nothing from require-dev, and vendor/ present because they will never
      # run composer themselves.
      - name: Build production vendor tree
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader

      - name: The archive carries its documentation and its tests
        run: |
          set -e
          for f in README.md SECURITY.md CHANGELOG.md LICENSE doc/clients.md \
                   .htaccess web.config \
                   vendor/autoload.php tests/php-unit-tests/bootstrap.php; do
            test -e "$f" || { echo "missing from the package: $f"; exit 1; }
          done
          ! grep -qxE '(README\.md|doc|LICENSE|SECURITY\.md|CHANGELOG\.md|tests|\.htaccess|web\.config)' exclude.txt
          test ! -d vendor/phpunit || { echo "require-dev leaked into vendor/"; exit 1; }

      # Exercised on every change rather than only at a tag: a bill of
      # materials that first runs during a release is one that first fails
      # during a release. The release workflow ships what this proves buildable.
      - name: The bill of materials and licence inventory build
        run: |
          set -e
          composer sbom > /tmp/sbom.json
          composer licenses --no-dev --format=json > /tmp/licenses.json
          php -r 'json_decode(file_get_contents("/tmp/sbom.json"), true, 512, JSON_THROW_ON_ERROR);'
          php -r '
            $a = json_decode(file_get_contents("/tmp/sbom.json"), true);
            $n = count($a["components"] ?? []);
            if ($n < 1) { fwrite(STDERR, "the SBOM lists no dependencies\n"); exit(1); }
            echo $n, " production dependencies inventoried\n";
          '

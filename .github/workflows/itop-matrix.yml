name: iTop matrix

# The unit suite proves the code is right about itself - ci.yml runs it across
# the PHP matrix, and the gate job below repeats it once so that nothing here
# starts on a tree that fails it. This workflow proves the code is right about
# iTop: that the setup still selects the module, that the compiled datamodel
# still holds what the controller reads, and that the endpoint still answers
# over HTTP. Those break without a commit here - they
# break when Combodo publishes a patch - which is why this also runs on a
# schedule and not only on pull requests.
#
# The versions come from .github/itop-support.json, resolved to the newest
# release of each supported branch at run time. Adding a branch is one line
# there; nothing in this file names a version.
#
# What gets installed is the packaged release from SourceForge, never a git
# tree: the repository does not carry every module a release ships, and one of
# the missing ones is a dependency of this module. See doc/ci-itop-matrix.md.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday morning. A release published on Friday is then a Monday finding
    # rather than something a user reports.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  # A throwaway instance on a throwaway machine. Nothing here is a secret; the
  # token the smoke test uses is minted at run time and masked.
  DB_HOST: 127.0.0.1
  DB_PORT: '3306'
  DB_USER: root
  DB_PWD: itop
  DB_NAME: itop_ci
  ITOP_ADMIN_USER: admin
  ITOP_ADMIN_PWD: Admin*2026!

jobs:
  # Nothing here needs a database, an iTop or a network hop, and it is what
  # fails while a change is being written. Running it in ci.yml alone is not
  # enough: that is a different workflow, so its result cannot gate anything in
  # this one, and the install jobs would start - MariaDB service, release
  # download, full setup, per version - on a tree whose unit suite is red.
  #
  # One PHP version, not the matrix. The question here is "is this tree worth
  # installing"; "does it work on 8.3 and 8.4" is ci.yml's question and is
  # answered in parallel with this whole workflow.
  unit:
    name: Unit suite (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Includes the static source checks (imports, file conventions), which
      # are unit tests here rather than a separate linter step.
      - name: Unit suite
        run: composer test:unit

  versions:
    name: Resolve the supported versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      pack_matrix: ${{ steps.resolve.outputs.pack_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.2'
          coverage: none

      - id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          php tools/ci/resolve-itop-versions.php | tee -a "$GITHUB_STEP_SUMMARY"
          matrix=$(php tools/ci/resolve-itop-versions.php --matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          # The example pack's job: each branch once, on the floor of its PHP
          # list. What it checks is the pack contract against an iTop, which the
          # install job's PHP ceiling already answers for the base.
          # shellcheck disable=SC2016
          echo "pack_matrix=$(printf '%s' "$matrix" | php -r '
            $a = json_decode(stream_get_contents(STDIN), true); $aFloor = [];
            foreach ($a["include"] as $e) {
              $b = $e["itop_branch"];
              if (!isset($aFloor[$b]) || version_compare($e["php"], $aFloor[$b]["php"], "<")) { $aFloor[$b] = $e; }
            }
            echo json_encode(["include" => array_values($aFloor)]);')" >> "$GITHUB_OUTPUT"

  # The first gate that touches an iTop, and still no database, no schema,
  # nothing to tear down. It downloads the release, puts the module in
  # extensions/ and asks the setup to compute what it would install - which is
  # where "this extension is not selectable on that version" shows up. About a
  # minute, against the several that a real install costs, and the install jobs
  # do not start until every version has answered.
  #
  # Order, cheapest first: unit suite (no iTop, no database) -> this (an iTop,
  # no database) -> install (a database) -> the suites that need the instance
  # the install produced.
  installable:
    name: Installable on iTop ${{ matrix.itop_release }} (no database)
    needs: [unit, versions]
    runs-on: ubuntu-latest
    continue-on-error: ${{ !matrix.stable }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.versions.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, gd, intl, mbstring, soap, zip, xml, ldap, opcache
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2

      # --no-dev, because what gets installed into iTop has to be what ships.
      - name: Build the vendor tree that ships
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader

      - name: Would the setup install this module
        env:
          ITOP_ZIP_URL: ${{ matrix.zip_url }}
          ITOP_DIR: ${{ runner.temp }}/itop
          DRY_RUN_ONLY: '1'
        run: tools/ci/install-itop.sh

      - name: Keep the log of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dryrun-${{ matrix.itop_release }}-php${{ matrix.php }}
          path: ${{ runner.temp }}/itop/ci-dryrun.log
          retention-days: 7
          if-no-files-found: warn

  install:
    name: iTop ${{ matrix.itop_release }} on PHP ${{ matrix.php }}
    needs: [versions, installable]
    runs-on: ubuntu-latest
    continue-on-error: ${{ !matrix.stable }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.versions.outputs.matrix) }}

    services:
      mariadb:
        # What iTop is developed against and what most instances run. The
        # version is pinned: a database that changes under us would turn every
        # job red at once with a cause nobody would look for here.
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: itop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # ITOP_DIR is deliberately not a job-level `env:` entry. The `runner`
    # context is not available when those are evaluated - GitHub rejects the
    # whole file with "Unrecognized named-value: 'runner'", which is a parse
    # error, so the workflow does not run at all rather than failing visibly.
    # $RUNNER_TEMP is the same value as an environment variable, set inside
    # every step, and $GITHUB_ENV carries it to the steps that follow.
    steps:
      - name: Where the iTop under test is unpacked
        run: echo "ITOP_DIR=$RUNNER_TEMP/itop" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Module code, read from extension.xml
        run: |
          echo "MODULE_CODE=$(sed -n 's#.*<extension_code>\(.*\)</extension_code>.*#\1#p' extension.xml | head -1)" >> "$GITHUB_ENV"

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, gd, intl, mbstring, soap, zip, xml, ldap, opcache
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2

      # The setup draws the impact-analysis graphs with it and warns without it.
      - name: Graphviz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz

      - name: Build the vendor tree that ships
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader

      - name: Unattended install with the module in extensions/
        env:
          ITOP_ZIP_URL: ${{ matrix.zip_url }}
          # Only for its tests/php-unit-tests. The iTop itself is the release.
          ITOP_TAG: ${{ matrix.itop_tag }}
        run: tools/ci/install-itop.sh

      # iTop's own validation for third-party modules: it walks everything the
      # setup compiled and checks the dictionaries resolve. It is their test,
      # run against our module, which makes it the one check here we did not
      # write and cannot accidentally make agree with us - so the script runs
      # their config rather than a file list of our own. What it tolerates, and
      # what it still fails on, is documented at the head of it.
      - name: iTop's module validation suite
        run: tools/ci/module-validation.sh

      # The suite that skips itself everywhere else. It extends iTop's
      # ItopDataTestCase, so it only ever runs where there is a real MetaModel -
      # here, and on a maintainer's local instance.
      - name: The module's integration suite, against this iTop
        working-directory: ${{ runner.temp }}/itop/tests/php-unit-tests
        run: |
          set -euo pipefail
          php vendor/bin/phpunit \
            --no-configuration \
            --bootstrap unittestautoload.php \
            --testdox \
            "${ITOP_DIR}/env-production/${MODULE_CODE}/tests/php-unit-tests/Integration"

      # One step, because the token exists only between these lines. It is
      # taken by its prefix, never as "the last line", and the check lines
      # around it are printed rather than swallowed.
      - name: Datamodel checks, then the endpoint over HTTP
        run: |
          set -euo pipefail
          if ! out=$(php tools/ci/itop-smoke.php "$ITOP_DIR" "$ITOP_ADMIN_USER"); then
            printf '%s\n' "$out"
            exit 1
          fi
          token=$(printf '%s\n' "$out" | sed -n 's/^http-smoke-token: //p')
          portal=$(printf '%s\n' "$out" | sed -n 's/^portal-smoke: //p')
          if [ -n "$token" ]; then echo "::add-mask::$token"; fi
          if [ -n "$portal" ]; then echo "::add-mask::${portal%%:*}"; fi
          printf '%s\n' "$out" | grep -v -e '^http-smoke-token: ' -e '^portal-smoke: ' || true
          [ -n "$token" ] || { echo "::error::checks/module-smoke.php minted no token for the HTTP smoke"; exit 1; }
          ITOP_TOKEN="$token" PORTAL_SMOKE="$portal" tools/ci/http-smoke.sh

      # The setup log is the only account of why a module was not selected, and
      # it is on a machine that is about to be deleted.
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: itop-${{ matrix.itop_release }}-php${{ matrix.php }}-logs
          path: |
            ${{ runner.temp }}/itop/ci-dryrun.log
            ${{ runner.temp }}/itop/ci-install.log
            ${{ runner.temp }}/itop/ci-httpd.log
            ${{ runner.temp }}/itop/log/
          retention-days: 7
          if-no-files-found: warn

  # The example pack, installed beside the module and called over HTTP. ci.yml's
  # example-pack job runs the pack's contract suite, which needs no iTop - and so
  # cannot see the setup skipping the pack's datamodel file, which it did: a
  # comment before <itop_design> left the pack's toolset scope undeclared, a
  # token asking for it was refused at login, and the contract suite stayed
  # green. pack-smoke.sh logs in with that scope.
  #
  # Its own instance rather than the install job's: the pack adds tools, and the
  # module's integration suite compares the tool surface with a committed
  # snapshot of the module alone. Each supported branch once, on the floor of its
  # PHP list (the versions job says which).
  example-pack:
    name: Example pack on iTop ${{ matrix.itop_release }} (PHP ${{ matrix.php }})
    needs: [versions, installable]
    runs-on: ubuntu-latest
    continue-on-error: ${{ !matrix.stable }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.versions.outputs.pack_matrix) }}

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: itop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Where the iTop under test is unpacked
        run: echo "ITOP_DIR=$RUNNER_TEMP/itop" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, gd, intl, mbstring, soap, zip, xml, ldap, opcache
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2

      - name: Graphviz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz

      - name: Build the vendor tree that ships
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader

      # The pack is placed the way its README says - copied under extensions/,
      # module file renamed, `composer package` - and the setup's own records
      # are asked whether it was installed, as for the module.
      - name: Unattended install with the module and the example pack
        env:
          ITOP_ZIP_URL: ${{ matrix.zip_url }}
          ITOP_TAG: ${{ matrix.itop_tag }}
          PACK_SRC: doc/example-pack
        run: tools/ci/install-itop.sh

      # Combodo's precanned-replies is not installed here, so
      # PrecannedReplyRenderTest skips every case: a green step that ran none of
      # them. Said in the run, rather than left to read as coverage. The
      # harness's own vendor/ is installed here: in the install job,
      # module-validation.sh does it, and this job does not run that.
      - name: The pack's integration suite, against this iTop
        working-directory: ${{ runner.temp }}/itop/tests/php-unit-tests
        run: |
          set -euo pipefail
          composer install --no-interaction --no-progress
          php vendor/bin/phpunit \
            --no-configuration \
            --bootstrap unittestautoload.php \
            --testdox \
            "${ITOP_DIR}/env-production/acme-servicedesk/tests/php-unit-tests/Integration" | tee "$RUNNER_TEMP/pack-integration.log"
          if grep -q 'Skipped:' "$RUNNER_TEMP/pack-integration.log"; then
            echo "::notice::PrecannedReplyRenderTest skipped: Combodo's precanned-replies is not installed on this instance, so the pack's integration suite ran no case here"
          fi

      - name: Every element of the pack, over HTTP
        run: tools/ci/pack-smoke.sh

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-pack-${{ matrix.itop_release }}-php${{ matrix.php }}-logs
          path: |
            ${{ runner.temp }}/itop/ci-dryrun.log
            ${{ runner.temp }}/itop/ci-install.log
            ${{ runner.temp }}/itop/ci-pack-httpd.log
            ${{ runner.temp }}/itop/log/
          retention-days: 7
          if-no-files-found: warn
